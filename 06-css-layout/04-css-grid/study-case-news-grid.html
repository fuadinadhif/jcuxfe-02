<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Grid</title>
    <style>
      html {
        --broken-white: rgba(255, 255, 255, 1);
        --purple: rgba(115, 63, 200, 1);
        --medium-gray: rgba(72, 85, 106, 1);
        --dark-gray: rgba(25, 32, 45, 1);
      }

      body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        background-color: rgba(236, 242, 248, 1);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        width: 1100px;
        height: 572px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        grid-auto-rows: 242px;
        column-gap: 30px;
        row-gap: 24px;
      }

      article {
        border-radius: 8px;
        box-shadow: 40px 60px 50px -47px rgba(72, 85, 106, 0.25);
      }

      #first {
        background-color: var(--purple);
        grid-column: span 2;
      }

      #second {
        background-color: var(--medium-gray);
      }

      #third {
        background-color: var(--broken-white);
        grid-row: span 2;
      }

      #fourth {
        background-color: var(--broken-white);
      }

      #fifth {
        background-color: var(--dark-gray);
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <header></header>
    <main>
      <article id="first"></article>
      <article id="second"></article>
      <article id="third"></article>
      <article id="fourth"></article>
      <article id="fifth"></article>
    </main>
    <footer></footer>
  </body>
</html>
