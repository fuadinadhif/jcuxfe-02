<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Case</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 8px;
      }

      div:nth-child(1) {
        background-color: greenyellow;
        /* grid-row-start: 1;
        grid-row-end: 4; */
        grid-row: span 3;
      }
      div:nth-child(2) {
        background-color: greenyellow;
        /* grid-column-start: 2;
        grid-column-end: 4; */
        grid-column: span 2;
      }
      div:nth-child(3) {
        background-color: orangered;
      }
      div:nth-child(4) {
        background-color: orange;
      }
      div:nth-child(5) {
        background-color: orangered;
      }
      div:nth-child(6) {
        background-color: greenyellow;
        grid-row: span 2;
      }
      div:nth-child(7) {
        background-color: orangered;
      }
      div:nth-child(8) {
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
  </body>
</html>
