<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position Relative</title>

    <style>
      #first {
        width: 50%;
        height: 200px;
        background-color: salmon;
      }

      #second {
        width: 50px;
        height: 50px;
        background-color: brown;
        position: relative;
        bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="first">
      <div id="second"></div>
    </div>
  </body>
</html>

<!-- 
div {
  position: static (default) | relative | absolute | fixed | sticky
  top: 10px;
  left: 10px;
  right: 10px;
  bottom: 10px;
}
-->
