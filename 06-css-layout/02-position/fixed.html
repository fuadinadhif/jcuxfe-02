<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position Fixed</title>

    <style>
      body {
        border: 1px solid red;
        /* height: calc(1000 * 5px); */
        height: 500vh;
      }

      #first {
        width: 50%;
        height: 200px;
        background-color: salmon;
        /* position: relative; */
      }

      #second {
        width: 50px;
        height: 50px;
        background-color: brown;
        position: fixed;
        left: 25px;
        bottom: 25px;
      }
    </style>
  </head>
  <body>
    <div id="first">
      <div id="second"></div>
    </div>
  </body>
</html>
