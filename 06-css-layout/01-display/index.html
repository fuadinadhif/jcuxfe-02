<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display</title>
    <style>
      * {
        /* border: 1px solid red; */
        border-width: 1px;
        border-style: solid;
        border-color: red;
      }

      h1,
      p {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Title</h1>
    <p>Lorem ipsum dolor sit, amet.</p>
    <footer>Created with 💖</footer>

    <hr />

    <span>Hello, everybody!</span>
    <time>2025-01-01</time>
    <small>Very little text</small>
  </body>
</html>
