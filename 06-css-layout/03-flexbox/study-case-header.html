<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Case - Header</title>
    <style>
      body {
        background-color: darkblue;
      }

      header {
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        /* padding: 16px; */
        /* padding: 16px 32px; */
        padding: 16px 32px 16px 32px;
        gap: 20px;
      }

      nav,
      div {
        display: flex;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <!-- logo -->
      <h1>Startup</h1>

      <!-- navigations -->
      <nav>
        <a>Tour</a>
        <a>Prices</a>
        <a>About</a>
        <a>F.A.Q</a>
        <a>Support</a>
      </nav>

      <!-- authentication -->
      <div>
        <a>Login</a>
        <a>Sign Up</a>
      </div>
    </header>
  </body>
</html>
