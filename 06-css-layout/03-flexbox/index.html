<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      body {
        border: 1px solid red;
        height: 500px;
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        /* flex-flow: row nowrap; */
        justify-content: center;
        align-items: end;
        gap: 10px;
      }

      div {
        width: 100px;
        height: 50px;
      }

      div:nth-child(1) {
        background-color: yellow;
      }
      div:nth-child(2) {
        background-color: greenyellow;
      }
      div:nth-child(3) {
        background-color: limegreen;
      }
      div:nth-child(4) {
        background-color: green;
      }
    </style>
  </head>
  <body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </body>
</html>
