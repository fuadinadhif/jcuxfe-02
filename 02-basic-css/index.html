<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* img {
        border-radius: 50%;
      } */

      img {
        width: 75px;
      }

      #first-image {
        border-radius: 50%;
      }

      .yellow-shadow {
        box-shadow: 5px 5px 0px yellow;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1
      style="
        color: red;
        border: 1px solid black;
        padding: 16px;
        font-family: Montserrat;
      "
    >
      Welcome to CSS World
    </h1>
    <p style="font-family: Montserrat">
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Odio repellat
      numquam officiis. Facere eligendi explicabo, minus doloribus rerum
      veritatis cupiditate qui aut? Doloribus atque laboriosam tempora et dolore
      consectetur obcaecati.
    </p>
    <img
      id="first-image"
      class="yellow-shadow"
      src="https://images.stockcake.com/public/9/b/f/9bf4adc2-d2c9-4725-8c4d-e70fe03732fe_large/moonlit-ocean-view-stockcake.jpg"
    />
    <img
      id="second-image"
      class="yellow-shadow"
      src="https://images.stockcake.com/public/9/b/f/9bf4adc2-d2c9-4725-8c4d-e70fe03732fe_large/moonlit-ocean-view-stockcake.jpg"
    />
    <img
      id="third-image"
      class="yellow-shadow"
      src="https://images.stockcake.com/public/9/b/f/9bf4adc2-d2c9-4725-8c4d-e70fe03732fe_large/moonlit-ocean-view-stockcake.jpg"
    />
  </body>
</html>
