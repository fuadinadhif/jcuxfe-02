<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Unit Length</title>
    <style>
      #absolute {
        height: 500px;
        background-color: tomato;
      }

      #relative {
        height: 50vh;
        background-color: turquoise;
      }
    </style>
  </head>
  <body>
    <div id="absolute"></div>
    <div id="relative"></div>
  </body>
</html>
