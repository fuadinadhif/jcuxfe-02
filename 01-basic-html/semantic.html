<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <img src="./images/youtube-logo.svg" alt="YouTube logo" width="200px" />

      <nav>
        <a>Home</a>
        <a>About</a>
        <a>Contact</a>
      </nav>

      <div>
        <button>Sign In</button>
        <button>Sign Up</button>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <h1>Welcome to My Page</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dignissimos
        quibusdam nesciunt numquam recusandae officia voluptatibus explicabo
        earum consequuntur cum accusamus dolorum laborum eveniet magnam sit, aut
        sequi eius aliquam fuga!
      </p>
    </main>

    <!-- Footer -->
    <footer>
      <p>Created with 💖</p>
    </footer>
  </body>
</html>
