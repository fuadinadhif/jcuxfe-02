<!DOCTYPE html>
<html>
  <head>
    <title>INTERNAL - Simple Card</title>
    <style>
      body {
        background-color: orange;
      }

      div {
        width: fit-content;
        height: fit-content;
        background-color: white;
        border: 2px solid black;
        /* padding-top: 26px;
        padding-bottom: 26px;
        padding-left: 22px;
        padding-right: 22px; */
        padding: 26px 22px;
        margin: 48px;
        font-family: monospace;
        text-align: center;
      }

      img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        margin-left: auto;
        margin-right: auto;
        display: block;
      }

      #testimonial {
        width: 200px;
      }

      #name {
        font-weight: 900;
        font-size: 32px;
        margin: 0;
      }

      #position {
        color: grey;
      }
    </style>
  </head>
  <body>
    <div>
      <img
        src="https://img.freepik.com/free-photo/close-up-upset-american-black-person_23-2148749582.jpg?semt=ais_hybrid&w=740&q=80"
      />
      <p id="testimonial">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ipsum id,
        numquam consectetur dolorum debitis eaque mollitia.
      </p>

      <p id="name">Chadwick</p>
      <p id="position">Director, Producer</p>
    </div>
  </body>
</html>
